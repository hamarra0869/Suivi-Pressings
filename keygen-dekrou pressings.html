<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEKROU PRESSING — Générateur de Clés PRO (Admin)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

  <!-- Card Keygen Admin -->
  <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-5 shadow-2xl relative">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 text-2xl flex items-center justify-center mx-auto mb-2">
        🔑
      </div>
      <h1 class="text-xl font-black text-white tracking-tight">DEKROU PRESSING®</h1>
      <p class="text-xs text-slate-400">Générateur Officiel de Licences PRO (Accès Admin)</p>
    </div>

    <!-- Saisie ID Client -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">ID Appareil Client (ex: DKX-8492-12)</label>
        <input type="text" id="deviceIdInput" placeholder="DKX-XXXX-XX" 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono font-bold text-sky-400 uppercase text-center focus:outline-none focus:border-sky-500 transition placeholder-slate-600">
      </div>

      <button onclick="generateKey()" 
        class="w-full bg-sky-600 hover:bg-sky-500 active:scale-[0.98] text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-sky-600/20 flex items-center justify-center gap-2">
        <span>⚡ Générer la Clé PRO</span>
      </button>
    </div>

    <!-- Résultat Clé Générée -->
    <div id="resultBox" class="hidden space-y-3 bg-slate-950 border border-slate-800 p-4 rounded-xl text-center">
      <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Clé de Licence Activée</div>
      <div id="generatedKeyDisplay" class="font-mono text-xl font-black text-emerald-400 select-all tracking-wider py-1 bg-slate-900 rounded border border-slate-800">
        PRO-XXXXX
      </div>

      <!-- Boutons d'Action Rapide -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="copyKey()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs py-2 rounded-lg font-semibold transition">
          📋 Copier Clé
        </button>
        <button onclick="sendKeyWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-lg font-bold transition flex items-center justify-center gap-1">
          💬 Envoyer Client
        </button>
      </div>
    </div>

    <!-- Notice de Sécurité -->
    <div class="text-[10px] text-slate-500 text-center border-t border-slate-800/80 pt-3">
      ⚠️ Ne partagez pas cette page. Algorithme calqué sur <strong class="text-slate-400">DEKROU_PRESSING_SECRET_2026</strong>.
    </div>

  </div>

  <script>
    const APP_SECRET = "DEKROU_PRESSING_SECRET_2026";
    let lastGeneratedKey = "";
    let lastDeviceId = "";

    // Même algorithme de hachage que dans l'application principale
    function generateValidKey(deviceId) {
      let hash = 0;
      const str = deviceId.trim().toUpperCase() + APP_SECRET;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return 'PRO-' + Math.abs(hash).toString(16).toUpperCase();
    }

    function generateKey() {
      const input = document.getElementById("deviceIdInput").value.trim().toUpperCase();
      if (!input) {
        alert("Veuillez saisir l'ID Appareil du client (ex: DKX-8492-12).");
        return;
      }

      lastDeviceId = input;
      lastGeneratedKey = generateValidKey(input);

      document.getElementById("generatedKeyDisplay").textContent = lastGeneratedKey;
      document.getElementById("resultBox").classList.remove("hidden");
    }

    function copyKey() {
      if (!lastGeneratedKey) return;
      navigator.clipboard.writeText(lastGeneratedKey);
      alert("✅ Clé PRO copieuse dans le presse-papier !");
    }

    function sendKeyWhatsApp() {
      if (!lastGeneratedKey) return;
      const msg = encodeURIComponent(
        `🎉 *ACTIVATION LICENCE PRO DEKROU PRESSING®*\n` +
        `-----------------------------------\n` +
        `Merci pour votre confiance !\n\n` +
        `📲 *ID Appareil :* ${lastDeviceId}\n` +
        `🔑 *Votre Clé PRO :* *${lastGeneratedKey}*\n\n` +
        `👉 Saisissez cette clé dans l'application pour débloquer l'accès illimité à vie.`
      );
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    }
  </script>
</body>
</html>
